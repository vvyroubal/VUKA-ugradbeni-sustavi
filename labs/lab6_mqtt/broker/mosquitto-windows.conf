# Lab 6 broker for Windows without virtualization (H1, path C): the native
# Mosquitto for Windows instead of the Docker container of run_broker.sh.
# Started by run_broker.ps1, which runs Mosquitto from the ROOT of the course
# repository -- the certificate paths below are relative to it (create them
# first with gen_certs.ps1).
# QEMU reaches it at 10.0.2.2:8883, tools on this computer at 127.0.0.1:8883.
listener 8883
allow_anonymous true
cafile   labs/lab6_mqtt/broker/certs/ca.crt
certfile labs/lab6_mqtt/broker/certs/server.crt
keyfile  labs/lab6_mqtt/broker/certs/server.key
require_certificate false
log_dest stdout
log_type all
