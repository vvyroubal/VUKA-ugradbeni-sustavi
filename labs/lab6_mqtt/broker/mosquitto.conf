# Mosquitto config for Lab 6 — TLS listener only, on :8883.
#
# allow_anonymous is TRUE here purely to keep the lab focused on the TLS
# transport (server authentication + encryption) without also introducing
# username/password or client-certificate auth. This is a deliberate
# simplification: doc 02's security week revisits MQTT authn/authz (client
# certificates, ACLs, per-topic permissions) — see the Lab 6 manual.

listener 8883
allow_anonymous true

# Server-side TLS material generated by gen_certs.sh and mounted at
# /mosquitto/certs (see run_broker.sh).
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# The device does not present a client certificate in this lab.
require_certificate false

log_dest stdout
log_type all
